[build]
  command = "git clone https://github.com/flutter/flutter.git --depth 1 -b stable _flutter && ./_flutter/bin/flutter build web --release"
  publish = "build/web"

[build.environment]
  FLUTTER_VERSION = "stable" //هذا الملف هو اللي يخلي Netlify يعرف واش من أوامر يدير باش يبني مشروع الـ Flutter تاعك.